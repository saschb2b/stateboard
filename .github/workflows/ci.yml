name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a fast-follow push doesn't
# pile up CI minutes for code nobody will look at again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: typecheck · lint · format · build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stateboard
          POSTGRES_PASSWORD: stateboard
          POSTGRES_DB: stateboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stateboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        # Match the runtime image (Dockerfile: node:26-bookworm-slim) so CI
        # tests what ships, not an older line.
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # The runtime is pure-JS (pg + better-auth) — no native build step.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Knowledge and design consistency
        run: pnpm docs:check

      - name: Test
        run: pnpm test

      - name: Release persistence integration tests
        env:
          STATEBOARD_INTEGRATION_DB_URL: postgres://stateboard:stateboard@localhost:5432/stateboard_test
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  stories:
    name: storybook · component tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every story renders in a real Chromium via Playwright, so the browser
      # binary is a build input. Cache it against the resolved Playwright
      # version — a ~130 MB download on every run otherwise.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only Chromium: vitest.config.ts declares a single chromium instance.
      # --with-deps is a no-op for libraries the runner image already has.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Renders every story and runs its play functions as interaction tests.
      - name: Story tests
        run: pnpm test:stories

  pages:
    name: static Pages compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static examples and guides
        env:
          PAGES_BUILD: "1"
        run: pnpm build:pages

  helm:
    name: helm lint · kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Setup kubeconform
        # Validates rendered manifests against versioned Kubernetes OpenAPI
        # schemas without needing a live cluster — replaces an earlier
        # `kubectl apply --dry-run=client`, which in kubectl 1.27+ tries to
        # reach the API server for schema validation and fails in CI.
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: helm dependency build
        run: helm dependency build deploy/helm/stateboard

      - name: helm lint
        run: |
          helm lint deploy/helm/stateboard \
            --set auth.secret=ci-test-secret-do-not-use \
            --set auth.keycloak.issuer=https://keycloak.example/realms/test \
            --set auth.keycloak.clientSecret=ci-test \
            --set postgresql.auth.password=ci-test

      - name: helm template | kubeconform
        run: |
          helm template stateboard deploy/helm/stateboard \
            --set auth.secret=ci-test-secret-do-not-use \
            --set auth.keycloak.issuer=https://keycloak.example/realms/test \
            --set auth.keycloak.clientSecret=ci-test \
            --set postgresql.auth.password=ci-test \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0

      # Multi-replica must render without error in v1 (Postgres handles
      # concurrency). This used to be a "must fail" check in v0.
      - name: Confirm replicaCount=2 renders
        run: |
          helm template stateboard deploy/helm/stateboard \
            --set replicaCount=2 \
            --set persistence.accessMode=ReadWriteMany \
            --set auth.secret=ci-test-secret-do-not-use \
            --set auth.keycloak.issuer=https://keycloak.example/realms/test \
            --set auth.keycloak.clientSecret=ci-test \
            --set postgresql.auth.password=ci-test \
            > /dev/null

      # The chart must fail closed if auth.secret is missing — sessions
      # without a secret would be insecure, so this is intentional.
      - name: Confirm missing auth.secret fails
        run: |
          if helm template stateboard deploy/helm/stateboard > /dev/null 2>&1; then
            echo "::error::Chart rendered without auth.secret — the safety guard is broken."
            exit 1
          fi
          echo "OK: chart correctly refused empty auth.secret."
