<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0E1418"/>
  <!-- crown — three facets, lit from upper right -->
  <polygon points="12,7 5,14 16,14" fill="#8A3613"/>
  <polygon points="12,7 20,7 16,14" fill="#F26B2D"/>
  <polygon points="20,7 27,14 16,14" fill="#FFC094"/>
  <!-- pavilion — two facets, darker as light refracts away -->
  <polygon points="5,14 16,14 16,28" fill="#4A1A05"/>
  <polygon points="16,14 27,14 16,28" fill="#C2541F"/>
  <!-- sparkle -->
  <path d="M24.5 4.5 L25.2 5.8 L26.5 6.5 L25.2 7.2 L24.5 8.5 L23.8 7.2 L22.5 6.5 L23.8 5.8 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>
